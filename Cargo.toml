[package]
name = "tgb-cli"
version = "0.1.0"
edition = "2024"
description = "可靠、可审计的淘股吧文章采集 CLI"
license = "MIT"
repository = "https://github.com/tinylion1024/tgb-cli"
homepage = "https://github.com/tinylion1024/tgb-cli"
readme = "README.md"
keywords = ["cli", "crawler", "taoguba", "research"]
categories = ["command-line-utilities"]

[[bin]]
name = "tgb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "brotli",
    "charset",
    "cookies",
    "deflate",
    "gzip",
    "http2",
    "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"
